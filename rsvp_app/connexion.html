<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invitation — Votre Présence est Souhaitée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ══════════════════════════════════════════════════════
       VARIABLES & RESET
    ══════════════════════════════════════════════════════ */
    :root {
      --noir:       #080c10;
      --bleu-nuit:  #0a1628;
      --bleu-ciel:  #5baee3;
      --bleu-clair: #a8d4f0;
      --or:         #c9a84c;
      --or-clair:   #e8cf8a;
      --blanc:      #f7f4ef;
      --blanc-pur:  #ffffff;

      /* Dimensions de l'enveloppe */
      --env-w: min(360px, 90vw);
      --env-h: calc(var(--env-w) * 0.68);
      --flap-h: calc(var(--env-w) * 0.42);

      /* Timings des animations */
      --t-flap:  0.8s;
      --t-card:  0.7s;
      --t-delay: 0.5s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden; /* on cachera le scroll pendant l'animation */
    }

    body {
      background: var(--noir);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Jost', sans-serif;
      color: var(--blanc);

      /* Fond étoilé via CSS pur */
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(91,174,227,.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(201,168,76,.06) 0%, transparent 55%);
    }

    /* ══════════════════════════════════════════════════════
       SCINTILLEMENT DE FOND (particules dorées légères)
    ══════════════════════════════════════════════════════ */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .stars span {
      position: absolute;
      border-radius: 50%;
      background: var(--or-clair);
      opacity: 0;
      animation: scintille var(--dur) ease-in-out infinite var(--delay);
    }
    @keyframes scintille {
      0%, 100% { opacity: 0; transform: scale(.6); }
      50%       { opacity: .5; transform: scale(1); }
    }

    /* ══════════════════════════════════════════════════════
       TITRE HAUT DE PAGE
    ══════════════════════════════════════════════════════ */
    .titre-page {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown .8s ease both;
    }
    .titre-page h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.4rem, 5vw, 2rem);
      letter-spacing: .18em;
      color: var(--blanc);
      text-transform: uppercase;
    }
    .titre-page .trait-or {
      display: block;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--or), transparent);
      margin: .6rem auto;
    }
    .titre-page p {
      font-size: .75rem;
      letter-spacing: .22em;
      color: var(--bleu-clair);
      text-transform: uppercase;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════════════════════
       CONTENEUR PRINCIPAL DE L'ENVELOPPE
       perspective: nécessaire pour l'effet 3D du rabat
    ══════════════════════════════════════════════════════ */
    .scene {
      position: relative;
      z-index: 2;
      width: var(--env-w);
      /* perspective 3D appliquée ici pour que le rabat pivote en profondeur */
      perspective: 1200px;
      perspective-origin: 50% 0%;
    }

    /* ══════════════════════════════════════════════════════
       CORPS DE L'ENVELOPPE
    ══════════════════════════════════════════════════════ */
    .enveloppe {
      position: relative;
      width: var(--env-w);
      height: var(--env-h);
      cursor: pointer;
      /* Ombre portée luxueuse */
      filter: drop-shadow(0 30px 60px rgba(91,174,227,.25))
              drop-shadow(0 8px 20px rgba(0,0,0,.6));
    }

    /* — Corps (rectangle principal) — */
    .env-corps {
      position: absolute;
      inset: 0;
      border-radius: 4px 4px 6px 6px;
      /* Dégradé bleu nuit → noir pour le dos de l'enveloppe */
      background: linear-gradient(170deg, #0d2040 0%, #060e1a 100%);
      border: 1px solid rgba(91,174,227,.3);
      overflow: hidden;
    }

    /* Plis de l'enveloppe (lignes diagonales en bas) */
    .env-corps::before,
    .env-corps::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
    }
    /* Triangle bas-gauche */
    .env-corps::before {
      left: 0;
      border-style: solid;
      border-width: 0 0 calc(var(--env-h) * .55) calc(var(--env-w) * .5);
      border-color: transparent transparent rgba(91,174,227,.12) transparent;
    }
    /* Triangle bas-droit */
    .env-corps::after {
      right: 0;
      border-style: solid;
      border-width: 0 calc(var(--env-w) * .5) calc(var(--env-h) * .55) 0;
      border-color: transparent rgba(91,174,227,.08) transparent transparent;
    }

    /* Ligne dorée décorative en bas de l'enveloppe */
    .env-bord-bas {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 5%, var(--or) 40%, var(--or-clair) 50%, var(--or) 60%, transparent 95%);
    }

    /* ══════════════════════════════════════════════════════
       RABAT SUPÉRIEUR (la partie qui s'ouvre)
       transform-origin en haut → pivot vers le haut
    ══════════════════════════════════════════════════════ */
    .env-rabat {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--flap-h);
      /* transform-origin : le rabat pivote depuis son bord supérieur */
      transform-origin: top center;
      /* transition 3D : ease-in pour l'accélération en début d'ouverture */
      transition: transform var(--t-flap) cubic-bezier(.4,0,.2,1);
      /* z-index élevé pour passer devant la carte au début */
      z-index: 10;
      /* Préserve l'espace 3D pour l'effet de volume */
      transform-style: preserve-3d;
    }

    /* Forme triangulaire du rabat via clip-path */
    .env-rabat-face {
      position: absolute;
      inset: 0;
      background: linear-gradient(185deg, #0f2645 0%, #091830 60%, #0d2040 100%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 90%);
      border-top: 1px solid rgba(91,174,227,.4);
    }

    /* Reflet lumineux subtil sur le rabat */
    .env-rabat-face::after {
      content: '';
      position: absolute;
      top: 5%;
      left: 15%;
      width: 70%;
      height: 50%;
      background: radial-gradient(ellipse at 50% 20%, rgba(91,174,227,.12) 0%, transparent 70%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 90%);
    }

    /* ══════════════════════════════════════════════════════
       ÉTAT OUVERT DU RABAT
       rotateX(-180deg) → bascule en arrière sur l'axe X
    ══════════════════════════════════════════════════════ */
    .scene.ouvert .env-rabat {
      transform: rotateX(-180deg);
    }

    /* ══════════════════════════════════════════════════════
       SCEAU CENTRAL (le clic se fait ici)
    ══════════════════════════════════════════════════════ */
    .env-sceau {
      position: absolute;
      /* Centré horizontalement, positionné à la jonction rabat/corps */
      left: 50%;
      top: calc(var(--flap-h) - 28px);
      transform: translateX(-50%);
      z-index: 20;

      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--or-clair), var(--or) 60%, #8c6e2a);
      border: 2px solid rgba(255,255,255,.2);
      box-shadow:
        0 0 0 3px rgba(201,168,76,.3),
        0 4px 16px rgba(0,0,0,.6),
        inset 0 1px 2px rgba(255,255,255,.3);

      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      /* Micro-animation de pulsation pour attirer l'attention */
      animation: pulse-sceau 2.5s ease-in-out infinite;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .env-sceau:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow:
        0 0 0 5px rgba(201,168,76,.4),
        0 6px 24px rgba(0,0,0,.7),
        inset 0 1px 2px rgba(255,255,255,.3);
    }
    .env-sceau:active {
      transform: translateX(-50%) scale(.96);
    }

    /* Monogramme dans le sceau */
    .env-sceau svg {
      width: 30px;
      height: 30px;
      fill: var(--noir);
      opacity: .85;
    }

    @keyframes pulse-sceau {
      0%, 100% { box-shadow: 0 0 0 3px rgba(201,168,76,.3), 0 4px 16px rgba(0,0,0,.6), inset 0 1px 2px rgba(255,255,255,.3); }
      50%       { box-shadow: 0 0 0 8px rgba(201,168,76,.15), 0 4px 20px rgba(201,168,76,.3), inset 0 1px 2px rgba(255,255,255,.3); }
    }

    /* Masque le sceau quand l'enveloppe est ouverte */
    .scene.ouvert .env-sceau {
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    /* ══════════════════════════════════════════════════════
       CARTE D'INVITATION (contient le formulaire)
       Initialement cachée DANS l'enveloppe (translateY(0) = au fond)
    ══════════════════════════════════════════════════════ */
    .carte {
      position: absolute;
      /* La carte démarre cachée dans l'enveloppe */
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: calc(var(--env-w) - 20px);
      /* Hauteur auto pour s'adapter au contenu */
      background: linear-gradient(160deg, var(--blanc) 0%, #eef4fa 100%);
      border-radius: 3px;
      padding: 2rem 1.6rem 1.8rem;
      color: var(--bleu-nuit);
      z-index: 5;
      /* La transition de sortie est retardée après l'ouverture du rabat */
      transition: transform var(--t-card) cubic-bezier(.22,.68,0,1.2) var(--t-delay);
      /* Ombre portée sur la carte */
      box-shadow: 0 -4px 30px rgba(91,174,227,.2), 0 2px 10px rgba(0,0,0,.3);
    }

    /* ══════════════════════════════════════════════════════
       ÉTAT OUVERT : la carte glisse vers le haut
       translateY négatif = remonte hors de l'enveloppe
    ══════════════════════════════════════════════════════ */
    .scene.ouvert .carte {
      /* La carte sort entièrement au-dessus de l'enveloppe */
      transform: translateX(-50%) translateY(calc(-100% - var(--env-h) + 30px));
    }

    /* Décoration haut de la carte : ligne or */
    .carte::before {
      content: '';
      display: block;
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--or), transparent);
      margin: 0 auto 1.2rem;
    }

    /* En-tête de la carte */
    .carte-header {
      text-align: center;
      margin-bottom: 1.4rem;
    }
    .carte-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: .08em;
      color: var(--bleu-nuit);
      line-height: 1.3;
    }
    .carte-header p {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--bleu-ciel);
      margin-top: .35rem;
    }

    /* ══════════════════════════════════════════════════════
       CHAMPS DU FORMULAIRE
       Style "ligne seule" (underline input)
    ══════════════════════════════════════════════════════ */
    .champ {
      position: relative;
      margin-bottom: 1.4rem;
    }
    .champ label {
      display: block;
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--bleu-ciel);
      margin-bottom: .3rem;
    }
    .champ input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(10,22,40,.25);
      padding: .5rem 0 .4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--bleu-nuit);
      outline: none;
      transition: border-color .25s ease;
    }
    .champ input::placeholder {
      color: rgba(10,22,40,.3);
      font-style: italic;
      font-size: .95rem;
    }
    /* Ligne qui s'anime au focus */
    .champ::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1.5px;
      background: linear-gradient(90deg, var(--bleu-ciel), var(--or));
      transition: width .3s ease;
    }
    .champ:focus-within::after {
      width: 100%;
    }

    /* ══════════════════════════════════════════════════════
       BOUTON DE VALIDATION
       Large, facile à presser avec le pouce
    ══════════════════════════════════════════════════════ */
    .btn-valider {
      display: block;
      width: 100%;
      padding: 1rem;
      margin-top: 1.8rem;
      background: linear-gradient(135deg, #1a3a6b 0%, #0d2040 100%);
      color: var(--blanc);
      font-family: 'Jost', sans-serif;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .25em;
      text-transform: uppercase;
      border: 1px solid rgba(91,174,227,.35);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease;
      /* Taille minimum pour l'accessibilité tactile */
      min-height: 52px;
    }
    .btn-valider::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(91,174,227,.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .25s ease;
    }
    .btn-valider:hover::before { opacity: 1; }
    .btn-valider:active {
      transform: scale(.98);
      box-shadow: inset 0 2px 8px rgba(0,0,0,.3);
    }

    /* ══════════════════════════════════════════════════════
       MESSAGES D'ERREUR
    ══════════════════════════════════════════════════════ */
    .messages-erreur {
      background: rgba(220,53,69,.1);
      border: 1px solid rgba(220,53,69,.3);
      border-radius: 3px;
      padding: .7rem .9rem;
      margin-bottom: 1rem;
      font-size: .8rem;
      color: #e56b76;
      text-align: center;
    }

    /* ══════════════════════════════════════════════════════
       INDICATEUR "CLIQUEZ SUR LE SCEAU"
    ══════════════════════════════════════════════════════ */
    .hint {
      position: relative;
      z-index: 2;
      margin-top: 2.5rem;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(168,212,240,.5);
      animation: fadeUp .8s ease .4s both;
    }
    .hint .fleche {
      display: block;
      font-size: 1.1rem;
      animation: bounce .9s ease-in-out infinite;
      color: var(--or);
      margin-bottom: .3rem;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Cache le hint une fois ouvert */
    .scene.ouvert ~ .hint {
      opacity: 0;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════
       RESPONSIVE — AJUSTEMENTS MOBILES
    ══════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .titre-page h1 { font-size: 1.25rem; }
      .titre-page { margin-bottom: 1.8rem; }
      .carte { padding: 1.6rem 1.2rem 1.4rem; }
      .carte-header h2 { font-size: 1.15rem; }
    }

    @media (max-width: 375px) {
      :root {
        --env-w: 88vw;
      }
      .carte { padding: 1.4rem 1rem 1.2rem; }
    }

    /* Gestion du safe-area iPhone (encoche/barre de navigation) */
    @supports (padding: max(0px)) {
      body {
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
        padding-top: max(1rem, env(safe-area-inset-top));
      }
    }

    /* ══════════════════════════════════════════════════════
       ANIMATION D'ENTRÉE DE LA SCÈNE
    ══════════════════════════════════════════════════════ */
    .scene {
      animation: fadeUp .9s cubic-bezier(.22,.68,0,1.2) .15s both;
    }
  </style>
</head>

<body>

<!-- Fond étoilé : particules dorées générées en JS -->
<div class="stars" id="stars"></div>

<!-- ── Titre ── -->
<div class="titre-page">
  <h1>Votre Invitation</h1>
  <span class="trait-or"></span>
  <p>Mariage &nbsp;·&nbsp; Veuillez vous identifier</p>
</div>

<!-- ════════════════════════════════════
     SCÈNE DE L'ENVELOPPE
════════════════════════════════════ -->
<div class="scene" id="scene">
  <div class="enveloppe" id="enveloppe">

    <!-- Corps de l'enveloppe -->
    <div class="env-corps">
      <div class="env-bord-bas"></div>
    </div>

    <!-- Rabat supérieur (s'ouvre en 3D) -->
    <div class="env-rabat">
      <div class="env-rabat-face"></div>
    </div>

    <!-- Sceau central (déclencheur du clic) -->
    <div class="env-sceau" id="sceau" role="button" aria-label="Ouvrir l'invitation" tabindex="0">
      <!-- Monogramme SVG minimaliste -->
      <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 3 L27 12 L27 27 L3 27 L3 12 Z" stroke="#080c10" stroke-width="1.2" fill="none"/>
        <path d="M3 12 L15 20 L27 12" stroke="#080c10" stroke-width="1.2" fill="none"/>
        <circle cx="15" cy="3" r="1.5" fill="#080c10"/>
      </svg>
    </div>

    <!-- ── Carte d'invitation (sort lors de l'ouverture) ── -->
    <div class="carte" id="carte">
      <div class="carte-header">
        <h2>Votre Présence<br><em>est Souhaitée</em></h2>
        <p>Identifiez-vous pour confirmer</p>
      </div>

      <!-- Messages d'erreur Django -->
      {% if messages %}
        <div class="messages-erreur">
          {% for message in messages %}{{ message }}{% endfor %}
        </div>
      {% endif %}

      <!-- Formulaire de connexion -->
      <form method="POST" action="{% url 'connexion' %}">
        {% csrf_token %}

        <div class="champ">
          <label for="nom">Nom de famille</label>
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Votre nom..."
            autocomplete="family-name"
            autocorrect="off"
            autocapitalize="characters"
            required
          />
        </div>

        <div class="champ">
          <label for="code_invitation">Code d'invitation</label>
          <input
            type="text"
            id="code_invitation"
            name="code_invitation"
            placeholder="Ex : MRG-2025-001"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            required
          />
        </div>

        <button type="submit" class="btn-valider">
          Ouvrir mon invitation &nbsp;→
        </button>
      </form>
    </div>
    <!-- /carte -->

  </div><!-- /enveloppe -->
</div><!-- /scene -->

<!-- Indicateur de clic -->
<p class="hint" id="hint">
  <span class="fleche">↑</span>
  Appuyez sur le sceau pour ouvrir
</p>


<script>
  /* ════════════════════════════════════════════════════════
     PARTICULES DORÉES EN FOND
  ════════════════════════════════════════════════════════ */
  (function() {
    const container = document.getElementById('stars');
    const count = 28;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2.5 + 1;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        --dur: ${Math.random() * 3 + 2}s;
        --delay: ${Math.random() * 4}s;
      `;
      container.appendChild(s);
    }
  })();

  /* ════════════════════════════════════════════════════════
     ANIMATION D'OUVERTURE DE L'ENVELOPPE
     Déclenchée au clic sur le sceau ou sa zone
  ════════════════════════════════════════════════════════ */
  const scene  = document.getElementById('scene');
  const sceau  = document.getElementById('sceau');
  const hint   = document.getElementById('hint');
  let   ouvert = false;

  function ouvrirEnveloppe() {
    if (ouvert) return; // Un seul déclenchement
    ouvert = true;

    /* 1. Ajoute la classe .ouvert sur .scene
          → déclenche rotateX(-180deg) sur le rabat (voir CSS)
          → déclenche translateY sur la carte (voir CSS) */
    scene.classList.add('ouvert');

    /* 2. Cache le hint */
    hint.style.opacity = '0';

    /* 3. Met le body en scrollable une fois la carte sortie
          (délai = durée de la transition) */
    setTimeout(() => {
      document.body.style.overflow = 'auto';
    }, 1400);
  }

  /* Clic sur le sceau */
  sceau.addEventListener('click', ouvrirEnveloppe);

  /* Accessibilité clavier (Entrée / Espace) */
  sceau.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      ouvrirEnveloppe();
    }
  });

  /* ════════════════════════════════════════════════════════
     OUVERTURE AUTOMATIQUE si Django a renvoyé une erreur
     (l'enveloppe doit déjà être ouverte pour montrer le formulaire)
  ════════════════════════════════════════════════════════ */
  {% if messages %}
  /* Ouvrir immédiatement sans animation si erreur présente */
  window.addEventListener('DOMContentLoaded', () => {
    scene.style.transition = 'none'; // désactive les transitions pour ouverture instantanée
    // On remet les transitions après un tick pour que le CSS prenne effet
    requestAnimationFrame(() => {
      scene.classList.add('ouvert');
      hint.style.opacity = '0';
      document.body.style.overflow = 'auto';
    });
  });
  {% endif %}
</script>

</body>
</html>
