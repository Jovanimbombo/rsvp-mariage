<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invitation — Mariage de Gloria & Eva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════
       VARIABLES & RESET
    ══════════════════════════════════════════════════════ */
    :root {
      --noir:       #080c10;
      --bleu-nuit:  #0a1628;
      --bleu-ciel:  #5baee3;
      --bleu-clair: #a8d4f0;
      --or:         #c9a84c;
      --or-clair:   #e8cf8a;
      --blanc:      #f7f4ef;
      --blanc-pur:  #ffffff;

      /* Dimensions adaptatives de l'enveloppe */
      --env-w: min(380px, 88vw);
      --env-h: calc(var(--env-w) * 0.65);
      --flap-h: calc(var(--env-w) * 0.42);

      /* Timings des animations */
      --t-flap:  0.6s;
      --t-card:  0.8s;
      --t-delay: 0.4s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: -webkit-fill-available;
    }

    body {
      background: var(--noir);
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: 'Jost', sans-serif;
      color: var(--blanc);
      overflow-x: hidden;
      overflow-y: hidden; /* Géré par le JS après ouverture */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 0;
      
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(91,174,227,.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(201,168,76,.06) 0%, transparent 55%);
    }

    /* ══════════════════════════════════════════════════════
       EFFET PARTICULES / ÉTOILES
    ══════════════════════════════════════════════════════ */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .stars span {
      position: absolute;
      border-radius: 50%;
      background: var(--or-clair);
      opacity: 0;
      animation: scintille var(--dur) ease-in-out infinite var(--delay);
    }
    @keyframes scintille {
      0%, 100% { opacity: 0; transform: scale(.6); }
      50%       { opacity: .5; transform: scale(1); }
    }

    /* ══════════════════════════════════════════════════════
       TITRE PRINCIPAL
    ══════════════════════════════════════════════════════ */
    .titre-page {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: max(1rem, env(safe-area-inset-top));
      margin-bottom: 2rem;
      flex-shrink: 0;
      animation: fadeDown .8s ease both;
    }
    .titre-page h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      letter-spacing: .18em;
      color: var(--blanc);
      text-transform: uppercase;
    }
    .titre-page .trait-or {
      display: block;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--or), transparent);
      margin: .6rem auto;
    }
    .titre-page p {
      font-size: .75rem;
      letter-spacing: .22em;
      color: var(--bleu-clair);
      text-transform: uppercase;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════════════════════
       CONTENEUR DE LA SCÈNE ET DE L'ENVELOPPE
    ══════════════════════════════════════════════════════ */
    .scene {
      position: relative;
      z-index: 2;
      width: var(--env-w);
      height: var(--env-h);
      margin: auto 0;
      perspective: 1500px;
      perspective-origin: 50% 0%;
      transition: margin 0.5s ease, height 0.5s ease;
      animation: fadeUp .9s cubic-bezier(.22,.68,0,1.2) .15s both;
    }

    /* Ajustement structurel pour laisser la carte respirer au scroll */
    .scene.ouvert {
      margin-top: 4rem; 
      margin-bottom: 2rem;
      height: auto;
    }

    .enveloppe {
      position: relative;
      width: var(--env-w);
      height: var(--env-h);
      transform-style: preserve-3d;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,.5));
      overflow: hidden; /* Masque la carte tant qu'elle est fermée */
    }

    .scene.ouvert .enveloppe {
      overflow: visible; /* Permet à la carte de sortir */
    }

    /* Fond intérieur de l'enveloppe */
    .env-fond-interieur {
      position: absolute;
      inset: 0;
      background: #050b14;
      border-radius: 4px;
      border: 1px solid rgba(91,174,227,.15);
      z-index: 1;
    }

    /* Poche avant de l'enveloppe */
    .env-poche-avant {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: linear-gradient(170deg, rgba(13,32,64,0) 40%, #060e1a 100%);
      pointer-events: none;
      border-radius: 0 0 6px 6px;
      overflow: hidden;
    }

    /* Découpes géométriques des plis */
    .env-poche-avant::before,
    .env-poche-avant::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
    }
    .env-poche-avant::before {
      left: 0;
      border-style: solid;
      border-width: 0 0 calc(var(--env-h) * .6) calc(var(--env-w) * .52);
      border-color: transparent transparent rgba(91,174,227,.14) transparent;
    }
    .env-poche-avant::after {
      right: 0;
      border-style: solid;
      border-width: 0 calc(var(--env-w) * .52) calc(var(--env-h) * .6) 0;
      border-color: transparent rgba(91,174,227,.1) transparent transparent;
    }

    .env-bord-bas {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 5%, var(--or) 40%, var(--or-clair) 50%, var(--or) 60%, transparent 95%);
    }

    /* Rabat supérieur pivotant */
    .env-rabat {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: var(--flap-h);
      transform-origin: top center;
      transition: transform var(--t-flap) cubic-bezier(.4, 0, .2, 1);
      z-index: 10;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .env-rabat-face {
      position: absolute;
      inset: 0;
      background: linear-gradient(185deg, #0f2645 0%, #091830 60%, #0d2040 100%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 95%);
      border-top: 1px solid rgba(91,174,227,.3);
    }

    .scene.ouvert .env-rabat {
      transform: rotateX(-180deg);
      z-index: 2; 
      transition: transform var(--t-flap) cubic-bezier(.4, 0, .2, 1), z-index 0s linear var(--t-flap);
    }

    /* ══════════════════════════════════════════════════════
       SCEAU DE FERMETURE
    ══════════════════════════════════════════════════════ */
    .env-sceau {
      position: absolute;
      left: 50%;
      top: calc(var(--flap-h) - 28px);
      transform: translateX(-50%);
      z-index: 20;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--or-clair), var(--or) 60%, #8c6e2a);
      border: 1px solid rgba(255,255,255,.2);
      box-shadow:
        0 0 0 3px rgba(201,168,76,.3),
        0 4px 16px rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: pulse-sceau 2.5s ease-in-out infinite;
      transition: transform .2s ease, opacity .3s ease;
    }
    .env-sceau:hover {
      transform: translateX(-50%) scale(1.06);
    }
    .env-sceau svg {
      width: 26px;
      height: 26px;
      fill: var(--noir);
    }

    @keyframes pulse-sceau {
      0%, 100% { box-shadow: 0 0 0 3px rgba(201,168,76,.3), 0 4px 16px rgba(0,0,0,.6); }
      50%       { box-shadow: 0 0 0 8px rgba(201,168,76,.15), 0 4px 20px rgba(201,168,76,.3); }
    }

    .scene.ouvert .env-sceau {
      opacity: 0;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════
       CARTE D'INVITATION & FORMULAIRE
    ══════════════════════════════════════════════════════ */
    .carte {
      position: absolute;
      bottom: calc(-1 * var(--env-h)); /* Complètement enfouie au départ */
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: calc(var(--env-w) - 16px);
      background: linear-gradient(160deg, var(--blanc) 0%, #eef4fa 100%);
      border-radius: 4px;
      padding: 2.2rem 1.6rem;
      color: var(--bleu-nuit);
      z-index: 1;
      opacity: 0;
      transition: transform var(--t-card) cubic-bezier(.25, 1, .5, 1) var(--t-delay), 
                  opacity var(--t-card) ease var(--t-delay);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Extraction fluide lors de l'ouverture */
    .scene.ouvert .carte {
      opacity: 1;
      position: relative;
      bottom: auto;
      left: auto;
      transform: translateY(-130px); /* Ajusté pour éviter les télescopages de texte */
      margin: 0 auto;
      z-index: 15;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(91,174,227,0.2);
    }

    .carte::before {
      content: '';
      display: block;
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--or), transparent);
      margin: 0 auto 1.2rem;
    }

    .carte-header {
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .carte-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.5rem;
      letter-spacing: .04em;
      color: var(--bleu-nuit);
      line-height: 1.4;
    }
    .carte-header h2 em {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      color: var(--or);
    }
    .carte-header p {
      font-size: .68rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--bleu-ciel);
      margin-top: .5rem;
    }

    /* Champs épurés */
    .champ {
      position: relative;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .champ label {
      display: block;
      font-size: .65rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #556575;
      margin-bottom: .2rem;
    }
    .champ input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(10,22,40,.2);
      padding: .6rem 0 .4rem;
      font-family: 'Jost', sans-serif;
      font-size: 1;
      color: var(--bleu-nuit);
      outline: none;
      transition: border-color .3s ease;
    }
    .champ::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 1.5px;
      background: linear-gradient(90deg, var(--bleu-ciel), var(--or));
      transition: width .3s ease;
    }
    .champ:focus-within::after {
      width: 100%;
    }

    /* Bouton d'action tactile */
    .btn-valider {
      display: block;
      width: 100%;
      padding: 1rem;
      margin-top: 2rem;
      background: linear-gradient(135deg, #1a3a6b 0%, #0d2040 100%);
      color: var(--blanc);
      font-family: 'Jost', sans-serif;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      border: 1px solid rgba(91,174,227,.25);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: transform .15s ease;
      min-height: 54px;
    }
    .btn-valider:active {
      transform: scale(.98);
    }

    .messages-erreur {
      background: rgba(220,53,69,.08);
      border: 1px solid rgba(220,53,69,.25);
      border-radius: 4px;
      padding: .7rem;
      margin-bottom: 1.2rem;
      font-size: .8rem;
      color: #d9534f;
      text-align: center;
    }

    /* ══════════════════════════════════════════════════════
       INDICATEURS DE BAS DE PAGE
    ══════════════════════════════════════════════════════ */
    .hint {
      position: relative;
      z-index: 2;
      margin-top: 2rem;
      margin-bottom: max(1rem, env(safe-area-inset-top));
      text-align: center;
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(168,212,240,.4);
      flex-shrink: 0;
      transition: opacity 0.3s ease;
    }
    .hint .fleche {
      display: block;
      font-size: 1.1rem;
      animation: bounce .9s ease-in-out infinite;
      color: var(--or);
      margin-bottom: .2rem;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }

    .scene.ouvert ~ .hint {
      opacity: 0;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════
       RESPONSIVE MODES
    ══════════════════════════════════════════════════════ */
    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding: 1.5rem 0;
      }
      .titre-page { margin-bottom: 1rem; }
      .carte { padding: 2rem 1.25rem 1.5rem; }
      .carte-header h2 { font-size: 1.35rem; }
      .scene.ouvert { margin-top: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="titre-page">
  <h1>L'Invitation</h1>
  <span class="trait-or"></span>
  <p>Mariage &nbsp;·&nbsp; Accès Personnel</p>
</div>

<div class="scene" id="scene">
  <div class="enveloppe" id="enveloppe">

    <div class="env-fond-interieur"></div>

    <div class="carte" id="carte">
      <div class="carte-header">
        <h2>Gloria & Eva<br><em>vous invitent</em></h2>
        <p>Veuillez entrer vos accès</p>
      </div>

      {% if messages %}
        <div class="messages-erreur">
          {% for message in messages %}{{ message }}{% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'connexion' %}">
        {% csrf_token %}

        <div class="champ">
          <label for="nom">Nom de la famille</label>
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Votre nom..."
            autocomplete="family-name"
            autocorrect="off"
            autocapitalize="characters"
            required
          />
        </div>

        <div class="champ">
          <label for="code_invitation">Code d'invitation</label>
          <input
            type="text"
            id="code_invitation"
            name="code_invitation"
            placeholder="Ex : MRG-2026-049"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            required
          />
        </div>

        <button type="submit" class="btn-valider">
          Découvrir mon invitation &nbsp;→
        </button>
      </form>
    </div>

    <div class="env-poche-avant">
      <div class="env-bord-bas"></div>
    </div>

    <div class="env-rabat">
      <div class="env-rabat-face"></div>
    </div>

    <div class="env-sceau" id="sceau" role="button" aria-label="Ouvrir l'invitation" tabindex="0">
      <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 3 L27 12 L27 27 L3 27 L3 12 Z" stroke="#080c10" stroke-width="1.2" fill="none"/>
        <path d="M3 12 L15 20 L27 12" stroke="#080c10" stroke-width="1.2" fill="none"/>
        <circle cx="15" cy="3" r="1.5" fill="#080c10"/>
      </svg>
    </div>

  </div>
</div>

<p class="hint" id="hint">
  <span class="fleche">↑</span>
  Appuyez sur le sceau pour ouvrir
</p>

<script>
  /* GÉNÉRATEUR DE SINTILLES */
  (function() {
    const container = document.getElementById('stars');
    const count = 30;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2 + 1;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        --dur: ${Math.random() * 3 + 2}s;
        --delay: ${Math.random() * 4}s;
      `;
      container.appendChild(s);
    }
  })();

  /* ANIMATION AU CLIC */
  const scene = document.getElementById('scene');
  const sceau = document.getElementById('sceau');
  let ouvert = false;

  function ouvrirEnveloppe() {
    if (ouvert) return;
    ouvert = true;

    scene.classList.add('ouvert');

    // On libère le défilement vertical une fois l'animation de sortie achevée
    setTimeout(() => {
      document.body.style.overflowY = 'auto';
    }, 1200);
  }

  sceau.addEventListener('click', ouvrirEnveloppe);
  sceau.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      ouvrirEnveloppe();
    }
  });

  /* COMPORTEMENT SI RETOUR D'ERREUR DJANGO */
  {% if messages %}
  window.addEventListener('DOMContentLoaded', () => {
    scene.classList.add('ouvert');
    document.body.style.overflowY = 'auto';
  });
  {% endif %}
</script>

</body>
</html>
